services:
  - type: web
    name: crm-facturacion
    runtime: node
    plan: free
    # Compila los dos frontends (CRM + panel-central) e instala las
    # dependencias de los dos backends — panel-central queda montado dentro
    # de este mismo servicio, bajo /panel (ver crm-facturacion/backend/server.js).
    buildCommand: "cd crm-facturacion/frontend && npm install --include=dev && npm run build && cd ../../panel-central/frontend && npm install --include=dev && npm run build && cd ../backend && npm install && cd ../../crm-facturacion/backend && npm install"
    startCommand: "node crm-facturacion/backend/server.js"
    healthCheckPath: /api/health
    # Disco persistente: requiere subir "plan" arriba de free (Render no
    # permite discos en el plan gratuito). Con el disco montado y DATA_DIR
    # apuntando ahí, la base de datos sobrevive a los redeploys — tanto la
    # del CRM (crm.db, empresas registradas) como la del panel (panel.db).
    disk:
      name: crm-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: PANEL_JWT_SECRET
        generateValue: true
      # Credenciales de Izipay para el cobro de la suscripción a la
      # plataforma (Gerencia → Mis pagos). Sin valor en este archivo a
      # propósito — se cargan a mano desde el dashboard de Render
      # (Environment) para no dejar secretos en el repositorio. Ver
      # crm-facturacion/README.md, sección "Suscripción a la plataforma".
      - key: IZIPAY_USERNAME
        sync: false
      - key: IZIPAY_PASSWORD
        sync: false
      - key: IZIPAY_PUBLIC_KEY
        sync: false
      - key: IZIPAY_HMAC_KEY
        sync: false
